name: Build Windows installer
on:
  workflow_dispatch:
    inputs:
      bundle_model:
        description: "Bundle TTS model offline (larger file, ~10-20 min longer)"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/api
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-desktop.txt pillow

      - name: Create icon
        run: |
          python make_icon.py
          if (-not (Test-Path "assets/icon.ico")) { throw "assets/icon.ico was not created" }
          Get-Item assets/icon.ico | Format-List Name, Length

      - name: Prefetch model for offline bundle
        if: github.event_name != 'workflow_dispatch' || inputs.bundle_model == true
        run: python prefetch_model.py
        timeout-minutes: 45

      - name: PyInstaller build
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python build_desktop.py
          if (-not (Test-Path "dist/VibeRead")) { throw "dist/VibeRead missing after PyInstaller" }
          Get-ChildItem dist/VibeRead | Select-Object -First 15 Name

      - name: Download WebView2 bootstrapper
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile installer/MicrosoftEdgeWebview2Setup.exe
          if (-not (Test-Path "installer/MicrosoftEdgeWebview2Setup.exe")) { throw "WebView2 bootstrapper download failed" }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Verify files before installer
        run: |
          Write-Host "=== Path checks (from apps/api) ==="
          $required = @(
            "assets/icon.ico",
            "dist/VibeRead",
            "installer/VibeRead.iss",
            "installer/MicrosoftEdgeWebview2Setup.exe"
          )
          foreach ($p in $required) {
            if (Test-Path $p) { Write-Host "OK  $p" }
            else { Write-Host "MISSING  $p"; throw "Missing $p" }
          }
          Write-Host "=== First lines of VibeRead.iss ==="
          Get-Content installer/VibeRead.iss -TotalCount 5 -Encoding UTF8

      - name: Build installer (Inno Setup)
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.1.0" }
          Write-Host "AppVersion = $v"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\VibeRead.iss
          if (-not (Test-Path "dist-installer/VibeRead-Setup.exe")) { throw "dist-installer/VibeRead-Setup.exe was not created" }
          Get-Item dist-installer/VibeRead-Setup.exe | Format-List Name, Length, LastWriteTime

      - uses: actions/upload-artifact@v6
        with:
          name: VibeRead-Setup
          path: apps/api/dist-installer/VibeRead-Setup.exe
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: apps/api/dist-installer/VibeRead-Setup.exe
